// the three greetings
const MODES={
  // HELLO I'M MICHAL. (two lines)
  full:()=>P,
  // HELLO. : the full stop moves up next to the O
  hello:()=>P.filter(p=>p[2]<=4).concat(P.filter(p=>p[2]===13).map(p=>[p[0]-267.8,p[1]-309.4,13])),
  // HI : the I of I'M moves next to the H
  hi:()=>P.filter(p=>p[2]===0||p[2]===5).map(p=>p[2]===5?[p[0]-787.2,p[1],5]:p),
};
let mode='full',circles=[],letters=[],BX=0,BY=0,BW=1,BH=1,cursorRadius=45.5,cursorBorder=45.5;

function build(m){
  mode=m;const pts=MODES[m]();
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const p of pts){x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1]);}
  BX=x0-ballRadius;BY=y0-ballRadius;BW=x1-x0+2*ballRadius;BH=y1-y0+2*ballRadius;
  // dots fly in from where the old ones were, so switching looks like the letters rearranging
  const old=circles;
  circles=pts.map((p,i)=>{const o=old.length?old[i%old.length]:null;
    return {x:o?o.x:p[0],y:o?o.y:p[1],homeX:p[0],homeY:p[1],letter:p[2],vx:0,vy:0,awayFrames:0,ghost:false};});
  letters=[];for(const c of circles)(letters[c.letter]=letters[c.letter]||[]).push(c);
  for(const b of document.querySelectorAll('#modes button'))b.setAttribute('aria-pressed',b.dataset.mode===m);
  fit(old.length>0);
}

// fit the greeting to the screen, leaving room for the buttons at the bottom
let sc=1,ox=0,oy=0,dpr=1,wall={l:0,t:0,r:1920,b:1080},W=0,H=0;
function fit(keep){
  const prev={sc,ox,oy};
  W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,3);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  const pad=Math.max(16,W*.06),bottom=110,top=70;
  sc=Math.min((W-2*pad)/BW,(H-top-bottom)/BH);
  ox=(W-BW*sc)/2-BX*sc;oy=top+(H-top-bottom-BH*sc)/2-BY*sc;
  wall={l:-ox/sc,t:-oy/sc,r:(W-ox)/sc,b:(H-oy)/sc};
  // the push area is about a fingertip on screen, whatever the size of the letters
  cursorRadius=34/sc;cursorBorder=22/sc;
  // keep dots where they are on screen when the scale changes
  if(keep)for(const c of circles){
    const sx=c.x*prev.sc+prev.ox,sy=c.y*prev.sc+prev.oy;c.x=(sx-ox)/sc;c.y=(sy-oy)/sc;}
}
addEventListener('resize',()=>fit(true));

// finger / mouse push (no visible ball). Let go and the letters rebuild.
const OFF=-1e5,cursor={x:OFF,y:OFF};let down=false,hover=false;
function push(cx,cy){cursor.x=(cx-ox)/sc;cursor.y=(cy-oy)/sc;}
function off(){cursor.x=cursor.y=OFF;}
cv.addEventListener('pointerdown',e=>{down=true;push(e.clientX,e.clientY);try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',e=>{if(down||e.pointerType==='mouse'){hover=e.pointerType==='mouse';push(e.clientX,e.clientY);}});
const up=e=>{down=false;if(e.pointerType!=='mouse')off();};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'&&!down)off();});

for(const b of document.querySelectorAll('#modes button'))b.addEventListener('click',()=>{if(b.dataset.mode!==mode)build(b.dataset.mode);});

// inside each letter two dots trade target spots when that shortens the total way home
function shareSpotsWithinLetters(){
  for(const group of letters){if(!group||group.length<2)continue;const n=group.length;
    for(let t=0;t<swapTriesPerLetter;t++){const a=group[(Math.random()*n)|0],b=group[(Math.random()*n)|0];if(a===b)continue;
      const now=(a.x-a.homeX)**2+(a.y-a.homeY)**2+(b.x-b.homeX)**2+(b.y-b.homeY)**2;
      const sw=(a.x-b.homeX)**2+(a.y-b.homeY)**2+(b.x-a.homeX)**2+(b.y-a.homeY)**2;
      if(sw<now-1){const hx=a.homeX,hy=a.homeY;a.homeX=b.homeX;a.homeY=b.homeY;b.homeX=hx;b.homeY=hy;}}}}
function moveBalls(){
  const zone=cursorRadius+cursorBorder+ballRadius;
  for(const c of circles){
    const dx=c.x-cursor.x,dy=c.y-cursor.y,d=Math.hypot(dx,dy);
    if(d<zone){const k=d>0?zone/d:1;
      c.vx+=(cursor.x+dx*k-c.x)*pushStrength;c.vy+=(cursor.y+dy*k-c.y)*pushStrength;
      c.vx*=friction;c.vy*=friction;c.awayFrames=0;c.ghost=false;}
    else{const hx=c.homeX-c.x,hy=c.homeY-c.y,hd=Math.hypot(hx,hy),speed=Math.min(hd*returnGain,returnMaxSpeed);
      const wx=hd>0?hx/hd*speed:0,wy=hd>0?hy/hd*speed:0;
      c.vx+=(wx-c.vx)*steer;c.vy+=(wy-c.vy)*steer;
      if(hd>snapDistance)c.awayFrames++;else{c.awayFrames=0;c.ghost=false;}
      if(c.awayFrames>ghostAfter)c.ghost=true;}
    const sp=Math.hypot(c.vx,c.vy);if(sp>maxSpeed){c.vx*=maxSpeed/sp;c.vy*=maxSpeed/sp;}
    c.x+=c.vx;c.y+=c.vy;}}
function separateBalls(){
  const minD=ballRadius*2+minDistance,n=circles.length;
  for(let i=0;i<n;i++){const a=circles[i];if(a.ghost)continue;
    for(let j=i+1;j<n;j++){const b=circles[j];if(b.ghost)continue;
      const dx=b.x-a.x;if(dx>minD||dx<-minD)continue;const dy=b.y-a.y;if(dy>minD||dy<-minD)continue;
      const d=Math.hypot(dx,dy);
      if(d<minD&&d>0){const p=(minD-d)*0.5*collisionSoftness/d;a.x-=dx*p;a.y-=dy*p;b.x+=dx*p;b.y+=dy*p;}}}}
function bounceOffWalls(){const r=ballRadius;
  for(const c of circles){
    if(c.x<wall.l+r){c.x=wall.l+r;c.vx=Math.abs(c.vx)*wallBounce;}
    if(c.x>wall.r-r){c.x=wall.r-r;c.vx=-Math.abs(c.vx)*wallBounce;}
    if(c.y<wall.t+r){c.y=wall.t+r;c.vy=Math.abs(c.vy)*wallBounce;}
    if(c.y>wall.b-r){c.y=wall.b-r;c.vy=-Math.abs(c.vy)*wallBounce;}}}
function settle(){
  for(const c of circles)
    if(Math.abs(c.homeX-c.x)<snapDistance&&Math.abs(c.homeY-c.y)<snapDistance&&Math.abs(c.vx)<0.05&&Math.abs(c.vy)<0.05){
      c.x=c.homeX;c.y=c.homeY;c.vx=0;c.vy=0;}}
function draw(){
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(dpr*sc,0,0,dpr*sc,dpr*ox,dpr*oy);
  ctx.fillStyle='#000';ctx.beginPath();
  for(const c of circles){ctx.moveTo(c.x+ballRadius,c.y);ctx.arc(c.x,c.y,ballRadius,0,Math.PI*2);}
  ctx.fill();}

build('full');
(function frame(){
  requestAnimationFrame(frame);
  shareSpotsWithinLetters();moveBalls();separateBalls();bounceOffWalls();settle();draw();
})();
}
</script>
