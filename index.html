<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Tilt</title>
<style>
  html{background:#fff}
  body{margin:0;background:#fff;color:#000;font:15px/1.4 system-ui,-apple-system,sans-serif;
    padding:calc(env(safe-area-inset-top) + 32px) max(20px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 32px) max(20px,env(safe-area-inset-left))}
  main{max-width:520px;margin:0 auto}
  h1{margin:0;font-size:34px;letter-spacing:-.5px;display:flex;align-items:center;gap:12px}
  h1 i{width:26px;height:26px;border-radius:50%;background:#000;display:inline-block}
  p{margin:8px 0 24px;color:#444}
</style>
</head>
<body>
<main>
  <h1><i></i>Tilt</h1>
  <p>Pick a version to play. Inside any version, tap ≡ in the corner to switch to another.</p>
  <nav id="home-list"></nav>
</main>
<script src="versions.js"></script>
</body>
</html>
